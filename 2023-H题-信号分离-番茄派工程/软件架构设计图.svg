<svg viewBox="0 0 1240 600" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" role="img">
  <title>2023 H题 信号分离 — 软件架构设计图(番茄派 MSPM0G3507)</title>
  <desc>main→h_app编排层→胶水层(sig_acq/sig_analysis/reconstruct/pll/mathacl_util)→纯C算法核(*_core, 离板可单测)→驱动与库; host_test 验证三个纯C核。</desc>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="600" fill="#ffffff"/>
  <text x="620" y="30" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">图二 · 软件架构设计图</text>

  <!-- legend -->
  <rect x="900" y="44" width="318" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="914" y="58" width="20" height="13" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="942" y="69" font-size="11.5" fill="#334155">绿 = 纯C算法核(离板已验证)</text>
  <line x1="916" y1="86" x2="936" y2="86" stroke="#16a34a" stroke-width="1.7" stroke-dasharray="5 3"/>
  <text x="942" y="90" font-size="11.5" fill="#334155">虚线 = host_test 离板验证</text>

  <!-- Band A: main + h_app -->
  <rect x="22" y="46" width="850" height="56" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="36" y="69" font-size="12.5" font-weight="bold" fill="#3730a3">main.c → SYSCFG_DL_init() → H_App_init() → while(1) H_App_loop()</text>
  <text x="36" y="90" font-size="12" fill="#4338ca">① 编排层 h_app:状态机 · 5ms 固定节拍 · 首帧建链/否则闭环 · result_ok 校验</text>

  <!-- band labels -->
  <text x="26" y="124" font-size="12.5" font-weight="bold" fill="#475569">② 胶水层(依赖硬件/库)</text>
  <text x="26" y="246" font-size="12.5" font-weight="bold" fill="#15803d">③ 纯C算法核(离板可单测)</text>
  <text x="26" y="362" font-size="12.5" font-weight="bold" fill="#475569">④ 离板验证 host_test</text>
  <text x="26" y="476" font-size="12.5" font-weight="bold" fill="#475569">⑤ 驱动(User) / 库 · 外设</text>

  <!-- ② glue row: 5 boxes -->
  <!-- x:40,240,440,640,840 w=180 -->
  <g>
    <rect x="40" y="132" width="180" height="74" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="130" y="160" font-size="12.5" fill="#0c4a6e" text-anchor="middle">sig_acq / 采集</text>
    <text x="130" y="180" font-size="11" fill="#475569" text-anchor="middle">ADC12+FIFO+DMA</text>
    <text x="130" y="196" font-size="10.5" fill="#64748b" text-anchor="middle">ADC0 通道2/PA25</text>

    <rect x="240" y="132" width="180" height="74" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="330" y="160" font-size="12.5" fill="#0c4a6e" text-anchor="middle">sig_analysis / 分析</text>
    <text x="330" y="180" font-size="11" fill="#475569" text-anchor="middle">窗+归一化+FFT</text>
    <text x="330" y="196" font-size="10.5" fill="#64748b" text-anchor="middle">arm_cfft_q15+atan2</text>

    <rect x="440" y="132" width="180" height="74" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="530" y="160" font-size="12.5" fill="#0c4a6e" text-anchor="middle">reconstruct / 重建</text>
    <text x="530" y="180" font-size="11" fill="#475569" text-anchor="middle">驱动 AD9959</text>
    <text x="530" y="196" font-size="10.5" fill="#64748b" text-anchor="middle">setFreq/Amp/Phase/Ftw</text>

    <rect x="640" y="132" width="180" height="74" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="730" y="160" font-size="12.5" fill="#0c4a6e" text-anchor="middle">pll / 锁相</text>
    <text x="730" y="180" font-size="11" fill="#475569" text-anchor="middle">II 型 PLL</text>
    <text x="730" y="196" font-size="10.5" fill="#64748b" text-anchor="middle">调 FTW 锁频锁相</text>

    <rect x="840" y="132" width="180" height="74" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="930" y="160" font-size="12.5" fill="#0c4a6e" text-anchor="middle">mathacl_util</text>
    <text x="930" y="184" font-size="11" fill="#475569" text-anchor="middle">MATHACL 封装</text>
  </g>

  <!-- ③ cores: 3 boxes under ana/rec/pll -->
  <g>
    <rect x="240" y="254" width="180" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="330" y="280" font-size="12" fill="#14532d" text-anchor="middle">sig_analysis_core</text>
    <text x="330" y="299" font-size="10.5" fill="#475569" text-anchor="middle">双峰+插值+谐波+去污</text>

    <rect x="440" y="254" width="180" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="530" y="280" font-size="12" fill="#14532d" text-anchor="middle">reconstruct_core</text>
    <text x="530" y="299" font-size="10.5" fill="#475569" text-anchor="middle">FTW / CPOW 换算</text>

    <rect x="640" y="254" width="180" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="730" y="280" font-size="12" fill="#14532d" text-anchor="middle">pll_core</text>
    <text x="730" y="299" font-size="10.5" fill="#475569" text-anchor="middle">II 型数字 PLL</text>
  </g>

  <!-- ④ host_test: 3 boxes -->
  <g>
    <rect x="240" y="370" width="180" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="330" y="403" font-size="11.5" fill="#334155" text-anchor="middle">test_sig_analysis</text>
    <rect x="440" y="370" width="180" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="530" y="403" font-size="11.5" fill="#334155" text-anchor="middle">test_reconstruct</text>
    <rect x="640" y="370" width="180" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="730" y="403" font-size="11.5" fill="#334155" text-anchor="middle">test_pll(三时钟域仿真)</text>
  </g>

  <!-- ⑤ drivers/libs: 6 boxes -->
  <g>
    <rect x="40" y="484" width="170" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="125" y="510" font-size="12" fill="#1e293b" text-anchor="middle">AD9959 驱动</text>
    <text x="125" y="528" font-size="10.5" fill="#64748b" text-anchor="middle">软件SPI(GPIO)</text>
    <rect x="230" y="484" width="170" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="315" y="517" font-size="12" fill="#1e293b" text-anchor="middle">DDS 封装</text>
    <rect x="420" y="484" width="170" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="505" y="517" font-size="12" fill="#1e293b" text-anchor="middle">Tick(SysTick 1ms)</text>
    <rect x="610" y="484" width="180" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="700" y="517" font-size="12" fill="#1e293b" text-anchor="middle">CMSIS-DSP</text>
    <rect x="810" y="484" width="170" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="895" y="517" font-size="12" fill="#1e293b" text-anchor="middle">MATHACL</text>
    <rect x="1000" y="484" width="200" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1100" y="517" font-size="12" fill="#1e293b" text-anchor="middle">TI DriverLib</text>
  </g>

  <!-- edges: h_app -> glue (fan) -->
  <path d="M130,102 L130,132" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <path d="M330,102 L330,132" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <path d="M530,102 L530,132" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <path d="M730,102 L730,132" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>
  <path d="M860,102 L930,132" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#a1)"/>

  <!-- glue -> core (vertical) -->
  <path d="M330,206 L330,254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M530,206 L530,254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <path d="M730,206 L730,254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- core -> test (dashed verify) -->
  <path d="M330,320 L330,370" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <path d="M530,320 L530,370" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a2)"/>
  <path d="M730,320 L730,370" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#a2)"/>

  <!-- pll -> reconstruct (calls setFtw) -->
  <path d="M640,178 L620,178" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="630" y="170" font-size="10" fill="#334155" text-anchor="middle">setFtw</text>

  <!-- data flow note -->
  <text x="36" y="230" font-size="11" fill="#94a3b8">数据流(每帧):采集 → 分析 →(首帧)建链 /(之后)锁相 → AD9959 输出;⑤ 被 ② 调用以访问硬件</text>
</svg>
