<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif" role="img">
  <title>2023 H题 信号分离 — 硬件连接结构图(番茄派 MSPM0G3507 + AD9959)</title>
  <desc>信号源A/B经NE5532加法器得C,进ADC0通道2(PA25),MSPM0经软件SPI驱动AD9959出A'/B',经重构滤波运放到示波器;A'+B'反馈引回ADC1供PLL锁相(代码已就绪,硬件待接)。</desc>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="afb" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c2410c"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="30" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="middle">图一 · 硬件连接结构图</text>

  <!-- legend -->
  <rect x="24" y="46" width="430" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="66" font-size="12" font-weight="bold" fill="#0f172a">引脚 / 说明</text>
  <text x="40" y="86" font-size="11.5" fill="#334155">· ADC 输入 C:PA25(ADC0 通道2)</text>
  <text x="40" y="105" font-size="11.5" fill="#334155">· AD9959 软件SPI:SCLK=PA7 · SDIO0=PB2 · CS=PB3</text>
  <text x="52" y="122" font-size="11.5" fill="#334155">UPDATE=PA8 · RST=PA9</text>
  <text x="40" y="141" font-size="11.5" fill="#c2410c">· PLL 反馈:A'+B' → ADC1(代码已就绪,硬件待接)</text>
  <text x="40" y="159" font-size="11.5" fill="#334155">· 三角波(发挥①)由模拟硬件链生成,固件只出正弦</text>

  <!-- 信号源 group -->
  <rect x="24" y="250" width="150" height="200" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="99" y="272" font-size="12.5" font-weight="bold" fill="#475569" text-anchor="middle">信号源(独立晶振)</text>
  <rect x="39" y="286" width="120" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="99" y="312" font-size="13" fill="#1e293b" text-anchor="middle">信号源 A</text>
  <text x="99" y="330" font-size="11" fill="#64748b" text-anchor="middle">20~100kHz</text>
  <rect x="39" y="372" width="120" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="99" y="398" font-size="13" fill="#1e293b" text-anchor="middle">信号源 B</text>
  <text x="99" y="416" font-size="11" fill="#64748b" text-anchor="middle">5kHz 整数倍</text>

  <!-- 加法器 -->
  <rect x="204" y="318" width="130" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="269" y="346" font-size="12.5" fill="#1e293b" text-anchor="middle">NE5532 加法器</text>
  <text x="269" y="366" font-size="11" fill="#64748b" text-anchor="middle">C=A+B 【基本①】</text>

  <!-- C 调理 -->
  <rect x="364" y="318" width="130" height="68" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="429" y="346" font-size="12.5" fill="#1e293b" text-anchor="middle">C 输入调理</text>
  <text x="429" y="366" font-size="11" fill="#64748b" text-anchor="middle">偏置+抗混叠LPF</text>

  <!-- MCU group -->
  <rect x="524" y="196" width="190" height="320" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="619" y="218" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">MSPM0G3507(片内SYSOSC→80MHz)</text>
  <rect x="539" y="232" width="160" height="62" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="619" y="258" font-size="12.5" fill="#1e293b" text-anchor="middle">ADC0 通道2 / PA25</text>
  <text x="619" y="276" font-size="11" fill="#475569" text-anchor="middle">ADC12+FIFO+DMA 1024pt</text>
  <rect x="539" y="320" width="160" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="619" y="346" font-size="12.5" fill="#1e293b" text-anchor="middle">FFT 分析</text>
  <text x="619" y="364" font-size="11" fill="#475569" text-anchor="middle">+ 软件 PLL</text>
  <rect x="539" y="430" width="160" height="68" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="5 3"/>
  <text x="619" y="456" font-size="12.5" fill="#9a3412" text-anchor="middle">ADC1 反馈通道</text>
  <text x="619" y="474" font-size="11" fill="#c2410c" text-anchor="middle">反馈采集(代码就绪,待接)</text>

  <!-- AD9959 group -->
  <rect x="744" y="252" width="160" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="824" y="274" font-size="12.5" font-weight="bold" fill="#15803d" text-anchor="middle">AD9959(25M×20=500M)</text>
  <rect x="759" y="288" width="130" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="824" y="321" font-size="13" fill="#1e293b" text-anchor="middle">CH0 → A'</text>
  <rect x="759" y="372" width="130" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="824" y="405" font-size="13" fill="#1e293b" text-anchor="middle">CH1 → B'</text>

  <!-- 重构 -->
  <rect x="944" y="282" width="140" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1014" y="308" font-size="12.5" fill="#1e293b" text-anchor="middle">重构LPF+运放</text>
  <text x="1014" y="326" font-size="11" fill="#64748b" text-anchor="middle">A'/B' ≥1Vpp</text>

  <!-- 三角波 -->
  <rect x="944" y="392" width="140" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="1014" y="418" font-size="12.5" fill="#1e293b" text-anchor="middle">三角波模拟链</text>
  <text x="1014" y="436" font-size="11" fill="#64748b" text-anchor="middle">【发挥①】</text>

  <!-- 示波器 -->
  <rect x="1104" y="300" width="84" height="100" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="1146" y="344" font-size="12.5" fill="#1e293b" text-anchor="middle">示波器</text>
  <text x="1146" y="362" font-size="10.5" fill="#64748b" text-anchor="middle">同频显示</text>

  <!-- edges -->
  <path d="M159,312 L186,312 L186,338 L204,338" class="e" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M159,398 L186,398 L186,366 L204,366" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M334,352 L364,352" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M494,352 L516,352 L516,263 L539,263" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M619,294 L619,320" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M699,350 L722,350 L722,316 L744,316" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="722" y="306" font-size="11" fill="#334155" text-anchor="middle">软件SPI(5线)</text>
  <path d="M889,316 L916,316 L916,308 L944,308" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M889,400 L916,400 L916,328 L944,328" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M1084,312 L1095,312 L1095,335 L1104,335" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M1014,348 L1014,392" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M1084,425 L1095,425 L1095,372 L1104,372" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- feedback dashed -->
  <path d="M1014,348 L1014,620 L619,620 L619,498" fill="none" stroke="#c2410c" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#afb)"/>
  <text x="816" y="613" font-size="11.5" font-weight="bold" fill="#c2410c" text-anchor="middle">反馈:A'+B' 经运放引回 ADC1(硬件待接)</text>
</svg>
